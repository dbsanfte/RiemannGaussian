      .open text { fill: #f2cc60; font-weight: 700; }
      .goal text { fill: #c9d1d9; font-weight: 700; }
      .open-edge { fill: none; stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .section { fill: #8b949e; font-size: 10px; font-weight: 700; text-anchor: start; }
      .gap-label { fill: #d29922; font-size: 10px; font-weight: 700; }
      .frontier { fill: #f2cc60; font-size: 11px; text-anchor: start; }
