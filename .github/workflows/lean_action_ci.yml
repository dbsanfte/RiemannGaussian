name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Reject unfinished Lean proofs
        shell: bash
        run: |
          if git grep -nE '\<(sorry|admit|sorryAx)\>' -- '*.lean'; then
            echo 'Lean sources contain a forbidden proof placeholder.' >&2
            exit 1
          fi
      # Path dependencies keep their artifacts outside the root `.lake`, which
      # is the only directory cached by lean-action.  Key this external proof
      # closure by every compiler, dependency, configuration, and source input;
      # Lake still runs below and validates the restored build traces.
      - name: Cache pinned Zeta23 proof artifacts
        uses: actions/cache@v5
        with:
          path: vendor/zeta23/.lake/build
          key: zeta23-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'vendor/zeta23/lakefile.toml', 'vendor/zeta23/lake-manifest.json', 'vendor/zeta23/Zeta23.lean', 'vendor/zeta23/Zeta23/**/*.lean') }}
      # Lean source/tactic linters report warnings.  `--wfail`, together with
      # `warningAsError` in lakefile.toml, makes every such diagnostic fail CI.
      - name: Build and enforce Lean lints
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
      - name: Run whole-project declaration linters
        shell: bash
        run: lake env lean -DwarningAsError=true scripts/LintProject.lean
      - name: Verify Lean-derived project dashboard
        shell: bash
        run: |
          lake env lean -DwarningAsError=true scripts/GenerateProjectStatus.lean
          git diff --exit-code -- docs/proof-status.json docs/proof-status.svg
