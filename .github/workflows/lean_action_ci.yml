name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Reject unfinished Lean proofs
        shell: bash
        run: |
          if git grep -nE '\<(sorry|admit)\>' -- '*.lean'; then
            echo 'Lean sources must not contain sorry or admit.' >&2
            exit 1
          fi
      # Lean source/tactic linters report warnings.  `--wfail`, together with
      # `warningAsError` in lakefile.toml, makes every such diagnostic fail CI.
      - name: Build and enforce Lean lints
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
