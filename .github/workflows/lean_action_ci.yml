name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # On a cold runner, building the vendored proofs and the native root in one
  # job exceeded the six-hour limit before either build cache could be saved.
  prepare-vendors:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "2"
    outputs:
      cache-key: ${{ steps.lookup.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for the pinned native proof dependencies
        id: lookup
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: &vendor_build_paths |
            vendor/zeta23/.lake/build
            vendor/openai-quasi-rh/.lake/build
          key: native-proof-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'vendor/zeta23/lake*', 'vendor/openai-quasi-rh/lake*', 'vendor/zeta23/**/*.lean', 'vendor/openai-quasi-rh/**/*.lean') }}
      - name: Make room for a cold dependency build
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Build the pinned native proof dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: >-
            +Zeta23 +OAI.NumberTheory.DirichletL.Nonvanishing
            +OAI.NumberTheory.DirichletL.RowCompletion.ZeroFreeRegion --wfail
          use-mathlib-cache: true
          use-github-cache: false
      - name: Save the checked native dependency builds
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: *vendor_build_paths
          key: ${{ steps.lookup.outputs.cache-primary-key }}

  build:
    needs: prepare-vendors
    runs-on: ubuntu-latest
    # Cold semiprime proofs share large imported environments. Bound concurrent
    # elaboration so their private heaps fit alongside the common proof closure.
    env:
      LEAN_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Allow the full Lean import closure to map its compiled regions
        # The expanded root exceeds Linux's common 65,530-mapping default.
        # This is independent of RAM/swap and leaves every proof gate intact.
        run: |
          lean_map_limit=$(sysctl -n vm.max_map_count)
          if (( lean_map_limit < 262144 )); then
            sudo sysctl -w vm.max_map_count=262144
          else
            sysctl vm.max_map_count
          fi
      - name: Keep exhaustive numerical verification out of ordinary builds
        run: |
          python3 scripts/numerical_certificate.py
          python3 scripts/test_numerical_certificate_build.py
          python3 scripts/test_numerical_certificate_scheduler.py
          python3 scripts/test_numerical_certificate_checkpoint.py
          python3 scripts/test_git_hook_environment.py
      - name: Reject unfinished Lean proofs
        shell: bash
        run: |
          python3 scripts/test_lean_placeholders.py
          python3 scripts/check_lean_placeholders.py
      - name: Check whitespace while preserving pinned historical evidence
        run: |
          python3 scripts/test_staged_whitespace.py
          python3 scripts/check_staged_whitespace.py --commit HEAD
      - name: Free unused SDKs for the expanded proof library
        # This job uses Lean, Python and Node; these preinstalled SDKs are unused.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Restore the pinned native proof dependencies
        uses: actions/cache/restore@v5
        with:
          path: *vendor_build_paths
          key: ${{ needs.prepare-vendors.outputs.cache-key }}
      # The cold carry-cell proof used about 5.4 GiB resident memory locally.
      # Leave headroom for concurrent dependencies on the hosted runner.
      - name: Provide memory headroom for cold proof builds
        run: |
          sudo fallocate -l 8G /swapfile-riemann
          sudo chmod 600 /swapfile-riemann
          sudo mkswap /swapfile-riemann
          sudo swapon /swapfile-riemann
      # Lean source/tactic linters report warnings.  `--wfail`, together with
      # `warningAsError` in lakefile.toml, makes every such diagnostic fail CI.
      - name: Build and enforce Lean lints
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
      - name: Check the arithmetic proof-shortening criterion
        run: >-
          python3 scripts/verify_alpoge_mined_bounds.py
          --fixed-prime-bounds --fixed-prime-block --fixed-prime-short-inverse
          --reuse-native
      - name: Run whole-project declaration linters
        shell: bash
        run: lake env lean -DwarningAsError=true scripts/LintProject.lean
      - name: Verify the pinned OpenAI proof and unconditional root-chain discharge
        shell: bash
        run: |
          python3 scripts/verify_openai_quasi_rh.py
          lake build OAI.NumberTheory.DirichletL.RowCompletion.ZeroFreeRegion --wfail
          lake env lean -DwarningAsError=true scripts/CheckQuasiRHIntegration.lean
      - name: Check optional data ownership with tiny Lean probes
        run: python3 scripts/test_numerical_certificate_build_config.py
      - name: Verify Lean-derived project dashboard
        shell: bash
        run: |
          lake env lean -DwarningAsError=true scripts/GenerateProjectStatus.lean
          git diff --exit-code -- docs/proof-status.json docs/proof-status.svg
      - name: Export and verify the actual theorem dependency graph
        shell: bash
        run: |
          lake env lean -DwarningAsError=true scripts/ExportTheoremGraph.lean
          python3 scripts/build_theorem_explorer.py --check
          node scripts/check_theorem_graph.cjs
      - name: Check the cached optional certificate explorer without exhaustive verification
        run: python3 scripts/build_numerical_certificate_explorer.py --check
      - name: Check semiprime algorithm progress and evidence freshness
        run: python3 scripts/build_semiprime_proof_explorer.py --check
      - name: Verify the shorter RH explorer and native theorem graph
        run: |
          THEOREM_GRAPH_METADATA=docs/rh-proof-explorer/metadata.json \
          THEOREM_GRAPH_OUTPUT=.lake/rh-proof-explorer/lean-graph.json \
            lake env lean -DwarningAsError=true scripts/ExportTheoremGraph.lean
          python3 scripts/build_rh_proof_explorer.py --check --check-commit-update HEAD^
      - name: Check the evergreen zero-free comparison graph
        shell: bash
        run: |
          python3 -m venv .lake/plot-venv
          .lake/plot-venv/bin/pip install -r scripts/requirements-plots.txt
          lake env lean -DwarningAsError=true scripts/ExportZeroFreePlot.lean
          .lake/plot-venv/bin/python scripts/build_zero_free_plot.py --check
          lake env lean -DwarningAsError=true scripts/ExportNumericalCertificatePlot.lean
          .lake/plot-venv/bin/python scripts/build_numerical_certificate_plot.py --check
      - name: Install the pinned explorer test browser
        shell: bash
        run: |
          python3 -m venv .lake/browser-venv
          .lake/browser-venv/bin/pip install -r scripts/requirements-browser.txt
          .lake/browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Check theorem explorer interactions and source links
        shell: bash
        run: |
          .lake/browser-venv/bin/python scripts/test_theorem_explorer.py
          .lake/browser-venv/bin/python scripts/test_numerical_certificate_explorer.py
          .lake/browser-venv/bin/python scripts/test_rh_proof_explorer.py
          .lake/browser-venv/bin/python scripts/test_semiprime_proof_explorer.py --browser
      - name: Check README with the live GitHub math renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .lake/browser-venv/bin/python scripts/test_github_readme.py
      - name: Assemble the verified Pages snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          THEOREM_SOURCE_SHA: ${{ github.sha }}
          THEOREM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/build_theorem_explorer.py --check \
            --site .lake/theorem-explorer/site \
            --revision "$THEOREM_SOURCE_SHA" --run-url "$THEOREM_RUN_URL"
      - name: Upload the verified theorem explorer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .lake/theorem-explorer/site

  deploy-theorem-explorer:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: theorem-explorer-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the proof explorers and algorithm progress view
        id: deployment
        uses: actions/deploy-pages@v4
