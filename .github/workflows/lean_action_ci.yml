name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Reject unfinished Lean proofs
        shell: bash
        run: |
          if git grep -nE '\<(sorry|admit|sorryAx)\>' -- '*.lean'; then
            echo 'Lean sources contain a forbidden proof placeholder.' >&2
            exit 1
          fi
      # Path dependencies keep their artifacts outside the root `.lake`, which
      # is the only directory cached by lean-action.  Key this external proof
      # closure by every compiler, dependency, configuration, and source input;
      # Lake still runs below and validates the restored build traces.
      - name: Cache pinned Zeta23 proof artifacts
        uses: actions/cache@v5
        with:
          path: vendor/zeta23/.lake/build
          key: zeta23-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'vendor/zeta23/lakefile.toml', 'vendor/zeta23/lake-manifest.json', 'vendor/zeta23/Zeta23.lean', 'vendor/zeta23/Zeta23/**/*.lean') }}
      # Lean source/tactic linters report warnings.  `--wfail`, together with
      # `warningAsError` in lakefile.toml, makes every such diagnostic fail CI.
      - name: Build and enforce Lean lints
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
      - name: Run whole-project declaration linters
        shell: bash
        run: lake env lean -DwarningAsError=true scripts/LintProject.lean
      - name: Verify Lean-derived project dashboard
        shell: bash
        run: |
          lake env lean -DwarningAsError=true scripts/GenerateProjectStatus.lean
          git diff --exit-code -- docs/proof-status.json docs/proof-status.svg
      - name: Export and verify the actual theorem dependency graph
        shell: bash
        run: |
          lake env lean -DwarningAsError=true scripts/ExportTheoremGraph.lean
          python3 scripts/build_theorem_explorer.py --check
          node scripts/check_theorem_graph.cjs
      - name: Install the pinned explorer test browser
        shell: bash
        run: |
          python3 -m venv .lake/browser-venv
          .lake/browser-venv/bin/pip install -r scripts/requirements-browser.txt
          .lake/browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Check theorem explorer interactions and source links
        shell: bash
        run: .lake/browser-venv/bin/python scripts/test_theorem_explorer.py
      - name: Check README with the live GitHub math renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .lake/browser-venv/bin/python scripts/test_github_readme.py
      - name: Assemble the verified Pages snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          THEOREM_SOURCE_SHA: ${{ github.sha }}
          THEOREM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/build_theorem_explorer.py --check \
            --site .lake/theorem-explorer/site \
            --revision "$THEOREM_SOURCE_SHA" --run-url "$THEOREM_RUN_URL"
      - name: Upload the verified theorem explorer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .lake/theorem-explorer/site

  deploy-theorem-explorer:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: theorem-explorer-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the verified zero-free theorem explorer
        id: deployment
        uses: actions/deploy-pages@v4
